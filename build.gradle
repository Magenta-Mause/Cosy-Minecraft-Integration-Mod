plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import java.net.URLEncoder

base {
    // Include MC version in the jar name so multi-version builds don't overwrite each other.
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

def versionKey = { String mcVersion -> mcVersion.replace(".", "_") }
def mcVersions = (project.findProperty("minecraft_versions") ?: project.minecraft_version)
        .split(",")
        .collect { it.trim() }
        .findAll { it }
def versionProp = { String prefix, String mcVersion ->
    def key = "${prefix}_${versionKey(mcVersion)}"
    return project.findProperty(key) ?: project.findProperty(prefix)
}

def metaBase = "https://meta.fabricmc.net"
def jsonSlurper = new JsonSlurper()
def jsonCache = [:]
def fetchJson = { String url ->
    jsonCache.computeIfAbsent(url) {
        new URL(url).withInputStream { stream -> jsonSlurper.parse(stream) }
    }
}

def xmlCache = [:]
def fetchXml = { String url ->
    xmlCache.computeIfAbsent(url) {
        new XmlSlurper().parse(url)
    }
}

def resolveYarnVersion = { String mcVersion ->
    def list = fetchJson("${metaBase}/v2/versions/yarn/${URLEncoder.encode(mcVersion, "UTF-8")}")
    def stable = list.findAll { it.stable }
    def pick = (stable ? stable : list)[0]
    return pick?.version
}

def resolveLoaderVersion = { String mcVersion ->
    def list = fetchJson("${metaBase}/v2/versions/loader/${URLEncoder.encode(mcVersion, "UTF-8")}")
    def stable = list.findAll { it.loader?.stable }
    def pick = (stable ? stable : list)[0]
    return pick?.loader?.version
}

def resolveFabricApiVersion = { String mcVersion ->
    def xml = fetchXml("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml")
    def allVersions = xml.versioning.versions.version*.text()
    def exact = allVersions.findAll { it.endsWith("+${mcVersion}") }
    if (exact) {
        return exact[-1]
    }
    def parts = mcVersion.split("\\.")
    def majorMinor = parts.length >= 2 ? "${parts[0]}.${parts[1]}" : mcVersion
    def majorMinorExact = allVersions.findAll { it.endsWith("+${majorMinor}") }
    if (majorMinorExact) {
        return majorMinorExact[-1]
    }
    def prefix = "+${majorMinor}."
    def patchCandidates = allVersions.findAll { it.contains(prefix) }
    if (!patchCandidates) {
        return null
    }
    def byPatch = patchCandidates.collect { v ->
        def suffix = v.substring(v.indexOf(prefix) + prefix.length)
        def patch = suffix.split("[^0-9]")[0]
        def patchNum = patch ? Integer.parseInt(patch) : -1
        [version: v, patch: patchNum]
    }.sort { a, b -> a.patch <=> b.patch }
    return byPatch[-1].version
}

def resolveVersionFor = { String prefix, String mcVersion ->
    def override = versionProp(prefix, mcVersion)
    if (override) {
        return override
    }
    if (prefix == "yarn") {
        return resolveYarnVersion(mcVersion)
    }
    if (prefix == "loader") {
        return resolveLoaderVersion(mcVersion)
    }
    if (prefix == "fabric") {
        return resolveFabricApiVersion(mcVersion)
    }
    return project.findProperty(prefix)
}

def requireVersion = { String label, String value, String mcVersion ->
    if (!value) {
        throw new GradleException("Could not resolve ${label} for Minecraft ${mcVersion}. Add ${label}_${versionKey(mcVersion)} to gradle.properties.")
    }
    return value
}

version = project.mod_version
group = project.maven_group

def resolvedYarnMappings = requireVersion("yarn", resolveVersionFor("yarn", project.minecraft_version), project.minecraft_version)
def resolvedLoaderVersion = requireVersion("loader", resolveVersionFor("loader", project.minecraft_version), project.minecraft_version)
def resolvedFabricApiVersion = requireVersion("fabric", resolveVersionFor("fabric", project.minecraft_version), project.minecraft_version)

loom {
    splitEnvironmentSourceSets()

    mods {
        "cosyintegrationmod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${resolvedYarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${resolvedLoaderVersion}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${resolvedFabricApiVersion}"

    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    testCompileOnly "org.projectlombok:lombok:1.18.46"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.46"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", resolvedLoaderVersion
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": resolvedLoaderVersion
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

def gradlew = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "gradlew.bat" : "./gradlew"
def buildTasks = mcVersions.collect { mcVersion ->
    tasks.register("buildMc${versionKey(mcVersion)}", Exec) {
        group = "build"
        def mc = mcVersion
        commandLine gradlew, "-Pminecraft_version=${mc}", "build"
    }
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds the mod for all Minecraft versions in minecraft_versions."
    dependsOn(buildTasks)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
