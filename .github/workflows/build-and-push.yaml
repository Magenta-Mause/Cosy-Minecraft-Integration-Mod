name: Build, Release & Publish (main)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-release-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all Minecraft versions
        run: ./gradlew clean buildAll

      - name: Read Minecraft versions
        id: versions
        run: |
          echo "mc_versions=$(python3 - <<'PY'
          import json
          import pathlib
          data = pathlib.Path("gradle.properties").read_text(encoding="utf-8")
          def get(name):
              for line in data.splitlines():
                  if line.startswith(name + "="):
                      return line.split("=", 1)[1].strip()
              return ""
          versions = [v.strip() for v in get("minecraft_versions").split(",") if v.strip()]
          print(json.dumps(versions))
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Compute release tag/name
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Automated build ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          generate_release_notes: true
          files: |
            build/libs/*.jar

      - name: Publish to Modrinth (all MC versions)
        env:
          MC_VERSIONS: ${{ steps.versions.outputs.mc_versions }}
          RELEASE_NAME: ${{ steps.rel.outputs.name }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          RELEASE_NOTES: ${{ steps.rel.outputs.name }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import shlex
          import pathlib
          mc_versions = json.loads(os.environ["MC_VERSIONS"])
          name = os.environ["RELEASE_NAME"]
          tag = os.environ["RELEASE_TAG"]
          notes = os.environ["RELEASE_NOTES"]
          token = os.environ["MODRINTH_TOKEN"]
          project_id = os.environ["MODRINTH_PROJECT_ID"]
          for mc in mc_versions:
              jar_pattern = pathlib.Path("build/libs") / f"*-mc{mc}-{tag}.jar"
              jar = next(jar_pattern.parent.glob(jar_pattern.name), None)
              if not jar:
                  print(f"Warning: No JAR found for MC {mc}")
                  continue
              args = [
                  "npx", "modrinth", "publish",
                  "--token", token,
                  "--project-id", project_id,
                  "--name", f"{name} (MC {mc})",
                  "--version-number", f"{tag}+mc{mc}",
                  "--changelog", notes,
                  "--loaders", "fabric",
                  "--game-versions", mc,
                  str(jar)
              ]
              cmd = ["bash", "-lc", " ".join(shlex.quote(a) for a in args)]
              print(f"Publishing {jar} for MC {mc}...")
              subprocess.check_call(cmd)
          print("All uploads complete.")
          PY
