name: Build, Release & Publish (main)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-release-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Make upload.py executable
        run: chmod +x upload.py

      - name: Build all Minecraft versions
        run: ./gradlew clean buildAll

      - name: Compute release tag/name
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Automated build ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
      
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3  # Latest version as of 2026
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/cosyintegrationmod-mc*.jar  # All your MC version JARs
            !build/libs/*-sources.jar  # Exclude sources if unwanted
          github-token: ${{ secrets.GITHUB_TOKEN }}  # Optional, since release exists