name: Build & Release (main)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all versions
        run: ./gradlew chiseledBuild

      - name: Collect jars
        id: jars
        shell: bash
        run: |
          set -euo pipefail

          # Collect distributable jars from all version builds into root build/libs
          mkdir -p build/libs
          find versions/*/build/libs -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} build/libs/ \;

          ls -la build/libs
          if [ -z "$(ls -A build/libs/*.jar 2>/dev/null)" ]; then
            echo "No jars found." >&2
            exit 1
          fi

      - name: Compute release tag/name
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Automated build ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
